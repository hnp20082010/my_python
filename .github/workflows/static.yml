<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>基层组织电子白板看板</title>
<style>
/* =============================================
   DARK THEME (default)
   ============================================= */
:root {
  --bg-main: #0d1117;
  --bg-card: #161b22;
  --bg-card2: #1c2230;
  --border: rgba(99,150,200,0.18);
  --border-bright: rgba(99,150,200,0.4);
  --accent-blue: #4f9cf9;
  --accent-green: #3fb950;
  --accent-orange: #f0883e;
  --accent-red: #f85149;
  --accent-purple: #a371f7;
  --accent-yellow: #e3b341;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #484f58;
  --shadow: none;
  --header-shadow: none;
  --tabbar-shadow: none;
  --bar-track-bg: rgba(255,255,255,0.06);
  --chart-grid: #ffffff10;
  --chart-bar-bg: #1c2230;
  --risk-promo-bg: linear-gradient(135deg, rgba(248,81,73,0.08), rgba(240,136,62,0.08));
  --risk-promo-border: rgba(248,81,73,0.15);
  --org-hero-bg: var(--bg-card2);
  --btn-hover: rgba(99,150,200,0.12);
  --btn-active: rgba(99,150,200,0.2);
  --switch-track: #30363d;
  --switch-thumb: #8b949e;
  --icon-color: #8b949e;
  --font: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  --header-h: 72px;
  --tab-bar-h: 56px;
  --progress-h: 4px;
  --content-h: calc(1080px - 72px - 56px - 4px);
}

/* =============================================
   LIGHT THEME
   ============================================= */
[data-theme="light"] {
  --bg-main: #f0f4f8;
  --bg-card: #ffffff;
  --bg-card2: #f6f8fa;
  --border: rgba(0,0,0,0.08);
  --border-bright: rgba(0,0,0,0.15);
  --accent-blue: #1a6cf6;
  --accent-green: #1a9e4a;
  --accent-orange: #d96a1a;
  --accent-red: #d63031;
  --accent-purple: #7c3aed;
  --accent-yellow: #b8860b;
  --text-primary: #1a1f2e;
  --text-secondary: #4a5568;
  --text-muted: #9aa5b4;
  --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 2px 12px rgba(0,0,0,0.04);
  --header-shadow: 0 1px 8px rgba(0,0,0,0.06);
  --tabbar-shadow: 0 1px 4px rgba(0,0,0,0.04);
  --bar-track-bg: rgba(0,0,0,0.06);
  --chart-grid: #00000010;
  --chart-bar-bg: #e2e8f0;
  --risk-promo-bg: linear-gradient(135deg, rgba(214,48,49,0.04), rgba(217,106,26,0.04));
  --risk-promo-border: rgba(214,48,49,0.1);
  --org-hero-bg: linear-gradient(135deg, rgba(26,108,246,0.05), rgba(124,58,237,0.05));
  --btn-hover: rgba(0,0,0,0.06);
  --btn-active: rgba(0,0,0,0.1);
  --switch-track: #d1d5db;
  --switch-thumb: #9aa5b4;
  --icon-color: #4a5568;
}

/* =============================================
   BASE
   ============================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg-main); font-family: var(--font);
  color: var(--text-primary); -webkit-font-smoothing: antialiased;
}

/* =============================================
   HEADER
   ============================================= */
.header {
  width: 100%; height: var(--header-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--header-shadow);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 36px; position: relative;
}
.header-left { display: flex; align-items: center; gap: 20px; }
.org-badge {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: #fff;
}
.org-name { font-size: 22px; font-weight: 700; }
.org-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.header-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  text-align: center;
}
.header-title { font-size: 26px; font-weight: 700; letter-spacing: 3px; }
.header-title span { color: var(--accent-blue); }
.header-right { display: flex; align-items: center; gap: 24px; }
.weather { text-align: center; }
.weather .temp { font-size: 22px; font-weight: 600; }
.weather .desc { font-size: 12px; color: var(--text-secondary); }
.datetime { text-align: right; }
.datetime .time { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent-blue); }
.datetime .date { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* Theme Toggle */
.theme-toggle {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px;
  transition: all 0.2s;
}
.theme-toggle:hover { border-color: var(--border-bright); }
.theme-icon { font-size: 18px; line-height: 1; }
.theme-label { font-size: 12px; color: var(--text-secondary); }

/* =============================================
   PROGRESS BAR
   ============================================= */
.scroll-progress {
  width: 100%; height: var(--progress-h);
  background: var(--bg-card2); overflow: hidden;
}
.scroll-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
  width: 0%; transition: width 0.1s linear;
}

/* =============================================
   TAB BAR
   ============================================= */
.tab-bar {
  width: 100%; height: var(--tab-bar-h);
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  box-shadow: var(--tabbar-shadow);
  display: flex; align-items: stretch; padding: 0 24px; gap: 4px;
}
.tab-item {
  display: flex; align-items: center; gap: 8px; padding: 0 24px;
  font-size: 15px; cursor: pointer; border-radius: 8px 8px 0 0;
  color: var(--text-secondary); border: 1px solid transparent; border-bottom: none;
  transition: all 0.3s; position: relative; user-select: none;
}
.tab-item:hover { color: var(--text-primary); background: var(--bg-main); }
.tab-item.active {
  color: var(--text-primary); background: var(--bg-main);
  border-color: var(--border); font-weight: 600;
}
.tab-item.active::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
  height: 2px; border-radius: 2px;
}
.tab-item:nth-child(1).active::after { background: var(--accent-blue); }
.tab-item:nth-child(2).active::after { background: var(--accent-orange); }
.tab-item:nth-child(3).active::after { background: var(--accent-purple); }
.tab-dot { width: 8px; height: 8px; border-radius: 50%; }
.tab-item:nth-child(1) .tab-dot { background: var(--accent-blue); }
.tab-item:nth-child(2) .tab-dot { background: var(--accent-orange); }
.tab-item:nth-child(3) .tab-dot { background: var(--accent-purple); }

/* Tab Nav Controls */
.tab-spacer { flex: 1; }
.tab-controls {
  display: flex; align-items: center; gap: 6px;
  align-self: center; flex-shrink: 0;
}
.tab-nav-btn {
  width: 30px; height: 30px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg-card2);
  color: var(--icon-color); font-size: 16px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; user-select: none;
}
.tab-nav-btn:hover { background: var(--btn-hover); border-color: var(--border-bright); color: var(--text-primary); }
.tab-nav-btn:active { background: var(--btn-active); }
.auto-badge {
  font-size: 11px; color: var(--text-muted);
  background: var(--bg-card2); border: 1px solid var(--border);
  padding: 4px 12px; border-radius: 20px;
  cursor: pointer; user-select: none; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.auto-badge:hover { border-color: var(--border-bright); color: var(--text-secondary); }
.auto-badge.paused {
  background: rgba(248,81,73,0.1); border-color: rgba(248,81,73,0.3);
  color: var(--accent-red);
}
.auto-dot { width: 6px; height: 6px; border-radius: 50%; }
.auto-badge:not(.paused) .auto-dot { background: var(--accent-green); }
.auto-badge.paused .auto-dot { background: var(--accent-red); }
.page-indicator {
  display: flex; align-items: center; gap: 4px;
  margin: 0 8px;
}
.page-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-muted); transition: all 0.3s;
}
.page-dot.current {
  background: var(--accent-blue);
  width: 10px; height: 10px;
}

/* =============================================
   CONTENT
   ============================================= */
.content-area {
  width: 100%; height: var(--content-h);
  position: relative; overflow: hidden;
}
.tab-page {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  padding: 24px 40px;
  display: none; flex-direction: column; gap: 20px;
  opacity: 0; transition: opacity 0.4s ease;
}

/* =============================================
   CARDS & COMPONENTS
   ============================================= */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 24px; overflow: hidden;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-title-dot { width: 10px; height: 10px; border-radius: 50%; }
.card-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: rgba(79,156,249,0.12); color: var(--accent-blue);
  border: 1px solid rgba(79,156,249,0.25);
}
.section-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

/* ---- TAB 1 ---- */
.t1-grid { display: grid; grid-template-columns: 380px 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
.t1-org {
  grid-row: 1/3; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px;
  box-shadow: var(--shadow);
}
.org-avatar-row {
  display: flex; align-items: center; gap: 16px; padding: 16px;
  background: var(--org-hero-bg); border-radius: 10px; border: 1px solid var(--border);
}
.org-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.org-info-name { font-size: 18px; font-weight: 700; }
.org-info-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.stat-box .label { font-size: 11px; color: var(--text-secondary); }
.stat-box .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
.stat-box .unit { font-size: 11px; color: var(--text-secondary); margin-left: 2px; }
.month-theme {
  background: linear-gradient(135deg, rgba(79,156,249,0.15), rgba(163,113,247,0.15));
  border: 1px solid var(--border-bright); border-radius: 10px; padding: 14px 16px;
}
[data-theme="light"] .month-theme {
  background: linear-gradient(135deg, rgba(26,108,246,0.06), rgba(124,58,237,0.06));
  border-color: rgba(26,108,246,0.15);
}
.month-theme .mt-label { font-size: 11px; color: var(--accent-blue); letter-spacing: 1px; }
.month-theme .mt-text { font-size: 16px; font-weight: 600; margin-top: 6px; }
.notice-list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.notice-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
  background: var(--bg-card2); border-radius: 8px; border-left: 3px solid var(--accent-blue);
}
.notice-item.warn { border-left-color: var(--accent-orange); }
.notice-item.success { border-left-color: var(--accent-green); }
.notice-content { flex: 1; }
.notice-title { font-size: 14px; font-weight: 500; }
.notice-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kpi-box {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; position: relative; overflow: hidden;
}
.kpi-box::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 3px; border-radius: 3px 3px 0 0;
}
.kpi-box.blue::before { background: var(--accent-blue); }
.kpi-box.green::before { background: var(--accent-green); }
.kpi-box.orange::before { background: var(--accent-orange); }
.kpi-box.red::before { background: var(--accent-red); }
.kpi-box.purple::before { background: var(--accent-purple); }
.kpi-box.yellow::before { background: var(--accent-yellow); }
.kpi-label { font-size: 12px; color: var(--text-secondary); }
.kpi-value { font-size: 28px; font-weight: 700; margin: 6px 0 4px; }
.kpi-progress-wrap { background: var(--bar-track-bg); border-radius: 4px; height: 5px; overflow: hidden; }
.kpi-progress-bar { height: 100%; border-radius: 4px; }
.kpi-footer { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-secondary); }
.honor-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.honor-item { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 10px; text-align: center; }
.honor-avatar {
  width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff;
}
.honor-name { font-size: 13px; font-weight: 600; }
.honor-role { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.honor-badge {
  display: inline-block; margin-top: 6px; font-size: 10px; padding: 2px 8px; border-radius: 20px;
  background: rgba(227,179,65,0.15); color: var(--accent-yellow); border: 1px solid rgba(227,179,65,0.3);
}

/* ---- TAB 2 ---- */
.t2-grid { display: grid; grid-template-columns: 1fr 1fr 420px; grid-template-rows: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
.safe-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.safe-metric-box {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px; text-align: center;
}
.safe-metric-box .big { font-size: 26px; font-weight: 700; }
.safe-metric-box .lbl { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.safe-days { font-size: 60px; font-weight: 800; color: var(--accent-green); line-height: 1; }
.risk-list { display: flex; flex-direction: column; gap: 8px; }
.risk-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--bg-card2); border-radius: 8px; border-left: 3px solid;
}
.risk-item.high { border-left-color: var(--accent-red); }
.risk-item.mid { border-left-color: var(--accent-orange); }
.risk-item.low { border-left-color: var(--accent-yellow); }
.risk-level { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap; }
.risk-level.high { background: rgba(248,81,73,0.15); color: var(--accent-red); }
.risk-level.mid { background: rgba(240,136,62,0.15); color: var(--accent-orange); }
.risk-level.low { background: rgba(227,179,65,0.15); color: var(--accent-yellow); }
.risk-text { flex: 1; font-size: 13px; }
.risk-status { font-size: 11px; color: var(--accent-green); }
.quality-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.q-stat {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; text-align: center;
}
.q-stat .qval { font-size: 24px; font-weight: 700; }
.q-stat .qlbl { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.case-list { display: flex; flex-direction: column; gap: 10px; overflow: hidden; height: calc(100% - 44px); }
.case-item {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 14px; border-left: 3px solid var(--accent-orange);
}
.case-item.quality { border-left-color: var(--accent-red); }
.case-type { font-size: 10px; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 4px; }
.case-type.safety, .case-item:not(.quality) .case-type { background: rgba(240,136,62,0.15); color: var(--accent-orange); }
.case-item.quality .case-type { background: rgba(248,81,73,0.12); color: var(--accent-red); }
.case-title { font-size: 14px; font-weight: 500; }
.case-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.5; }
.case-footer { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
.promo-banner {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
  height: calc(100% - 44px); display: flex; flex-direction: column; gap: 8px; overflow: hidden;
}
.promo-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--risk-promo-bg); border-radius: 8px; border: 1px solid var(--risk-promo-border);
}
.promo-icon { font-size: 20px; }
.promo-text { font-size: 14px; font-weight: 500; }
.promo-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* ---- TAB 3 ---- */
.t3-grid { display: grid; grid-template-columns: 1fr 380px 380px; grid-template-rows: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; }
.activity-photos { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; height: calc(100% - 44px); }
.photo-box {
  border-radius: 10px; background: var(--bg-card2); border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.photo-box.main { grid-column: 1/3; }
.photo-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 14px; background: linear-gradient(transparent, rgba(0,0,0,0.7));
  font-size: 13px; font-weight: 500; color: #fff;
}
.birthday-list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; height: calc(100% - 44px); }
.birthday-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-card2); border-radius: 8px; }
.birthday-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.birthday-name { font-size: 14px; font-weight: 500; }
.birthday-date { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.birthday-icon { margin-left: auto; font-size: 18px; }
.score-list { display: flex; flex-direction: column; gap: 6px; overflow: hidden; height: calc(100% - 44px); }
.score-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--bg-card2); border-radius: 8px; }
.score-rank { width: 24px; text-align: center; font-size: 16px; font-weight: 700; }
.score-name { flex: 1; font-size: 14px; }
.score-bar-wrap { width: 100px; background: var(--bar-track-bg); border-radius: 4px; height: 5px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 4px; }
.score-val { font-size: 14px; font-weight: 700; width: 40px; text-align: right; }
.wall-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; height: calc(100% - 44px); }
.wall-item {
  background: var(--bg-card2); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.wall-header { display: flex; align-items: center; gap: 10px; }
.wall-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.wall-name { font-size: 13px; font-weight: 500; }
.wall-time { font-size: 11px; color: var(--text-muted); margin-left: auto; }
.wall-text { font-size: 13px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
.wall-like { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
.qr-section {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 12px; background: rgba(163,113,247,0.08);
  border: 1px solid rgba(163,113,247,0.2); border-radius: 8px; margin-left: auto;
}
.qr-box {
  width: 28px; height: 28px; background: #fff; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.qr-text { font-size: 12px; color: var(--text-secondary); }
.chart-svg { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- DATA LOADING -->
<script>
var FALLBACK_DATA = {
  updatedAt:"2026-05-26",
