<script>
// ===== DATA LOADING =====
const params = new URLSearchParams(window.location.search);
const TEAM = params.get('team') || '';

// Load data from server API (or fallback)
async function loadData() {
  if (TEAM) {
    try {
      const resp = await fetch('/api/data?team=' + encodeURIComponent(TEAM));
      if (resp.ok) { const data = await resp.json(); return data; }
      console.warn('Team data load failed, trying local data.js');
    } catch(e) { console.warn('Server not reachable, trying local data.js'); }
  }
  // Fallback: try local data.js (for offline/standalone use)
  if (window.BOARD_DATA) return window.BOARD_DATA;
  // Last resort: embedded fallback
  return FALLBACK_DATA;
}

// ===== UTILITY =====
const avatars = [
  'linear-gradient(135deg,#f0883e,#e3b341)',
  'linear-gradient(135deg,#4f9cf9,#a371f7)',
  'linear-gradient(135deg,#3fb950,#4f9cf9)',
  'linear-gradient(135deg,#a371f7,#f85149)',
  'linear-gradient(135deg,#e3b341,#f0883e)',
  'linear-gradient(135deg,#f85149,#a371f7)'
];

function accentVar(c) {
  const map = {blue:'var(--accent-blue)',green:'var(--accent-green)',orange:'var(--accent-orange)',red:'var(--accent-red)',purple:'var(--accent-purple)',yellow:'var(--accent-yellow)',green_special:'var(--accent-green)'};
  return map[c] || 'var(--accent-blue)';
}

function kpiPct(v,t,lb) {
  if (!t||t===0) return 100;
  return lb ? Math.min((t/v)*100,100) : Math.min((v/t)*100,100);
}

function kpiStatus(v,t,lb) {
  const pct = kpiPct(v,t,lb);
  if (pct>=100) return '<span style="color:var(--accent-green)">达标</span>';
  if (pct>=90) return '<span style="color:var(--accent-blue)">'+pct.toFixed(1)+'%</span>';
  if (pct>=80) return '<span style="color:var(--accent-orange)">'+pct.toFixed(1)+'%</span>';
  return '<span style="color:var(--accent-red)">'+pct.toFixed(1)+'%</span>';
}

function fmtNum(n) { return typeof n==='number'?n.toLocaleString():n; }

function getTheme() { return document.documentElement.dataset.theme||'dark'; }

function chartGridColor() { return getTheme()==='dark'?'#ffffff10':'#00000010'; }
function chartBarBg() { return getTheme()==='dark'?'#1c2230':'#e2e8f0'; }
function chartGradStop1() { return getTheme()==='dark'?'#4f9cf9':'#1a6cf6'; }
function chartGradId(prefix) { return prefix+(getTheme()==='dark'?'_d':'_l'); }

// ===== RENDER TAB 1 =====
function renderTab1(D) {
  const t1 = document.getElementById('t1Content');
  if (!t1) return;
  const theme = getTheme();
  const cg = chartGridColor(), cbb = chartBarBg();
  const gid = chartGradId('grad1');

  const noticesHtml = D.notices.map(n =>
    '<div class="notice-item'+(n.type==='warn'?' warn':n.type==='success'?' success':'')+'">'+
    '<div class="notice-content"><div class="notice-title">'+n.title+'</div>'+
    '<div class="notice-meta">'+n.meta+'</div></div></div>'
  ).join('');

  const kpiHtml = D.kpi.map(k => {
    const pct = kpiPct(k.value, k.target, k.lowerBetter);
    let statusHtml = k.value;
    if (k.unit) {
      const dv = typeof k.value==='number'?k.value.toLocaleString():k.value;
      statusHtml = dv+'<span style="font-size:13px;font-weight:400;color:var(--text-secondary)"> '+k.unit+'</span>';
    }
    const cls = k.color==='green_special'?'green':k.color;
    return '<div class="kpi-box '+cls+'">'+
      '<div class="kpi-label">'+k.label+'</div>'+
      '<div class="kpi-value" style="color:'+accentVar(k.color)+'">'+statusHtml+'</div>'+
      '<div class="kpi-progress-wrap"><div class="kpi-progress-bar" style="width:'+Math.min(pct,100)+'%;background:'+accentVar(k.color)+'"></div></div>'+
      '<div class="kpi-footer"><span>目标 '+fmtNum(k.target)+(k.unit?' '+k.unit:'')+'</span>'+kpiStatus(k.value,k.target,k.lowerBetter)+'</div>'+
      '</div>';
  }).join('');

  const honorHtml = D.honor.map((h,i) =>
    '<div class="honor-item">'+
    '<div class="honor-avatar" style="background:'+avatars[i%avatars.length]+'">'+h.surname+'</div>'+
    '<div class="honor-name">'+h.name+'</div><div class="honor-role">'+h.role+'</div>'+
    '<div class="honor-badge">'+h.badge+'</div></div>'
  ).join('');

  // Trend chart
  const tvals = D.trend.values;
  const tmax = Math.max(...tvals)*1.1, tmin = Math.min(...tvals)*0.9;
  const trange = tmax-tmin||1;
  const xStep=100, xStart=110;
  const ac = theme==='dark'?'#4f9cf9':'#1a6cf6';

  let svgParts = '';
  const gridLines = [tmin, tmin+trange*0.25, tmin+trange*0.5, tmin+trange*0.75, tmax];
  gridLines.forEach(v => {
    const y = 140-((v-tmin)/trange)*120;
    svgParts += '<line x1="60" y1="'+y+'" x2="660" y2="'+y+'" stroke="'+cg+'" stroke-width="1"/>';
    svgParts += '<text x="52" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--text-secondary)">'+Math.round(v)+'</text>';
  });

  let points='', polyPts='';
  tvals.forEach((v,i)=>{
    const x=xStart+i*xStep, y=140-((v-tmin)/trange)*120;
    points += '<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+ac+'"/>';
    polyPts += x+','+y+' ';
    const txtCol = i===tvals.length-1?ac:'var(--text-secondary)';
    const txtWt = i===tvals.length-1?'font-weight="600"':'';
    if (i===tvals.length-1) {
      svgParts += '<text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-size="11" fill="'+ac+'">'+v.toLocaleString()+'</text>';
    }
    svgParts += '<text x="'+x+'" y="168" text-anchor="middle" font-size="11" fill="'+txtCol+'" '+txtWt+'>'+D.trend.months[i]+'</text>';
  });

  const trendSvg = '<svg viewBox="0 0 680 180" style="width:100%;height:calc(100% - 44px)">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+ac+'" stop-opacity="0.3"/>'+
    '<stop offset="100%" stop-color="'+ac+'" stop-opacity="0"/></linearGradient></defs>'+
    svgParts+
    '<polygon points="'+polyPts+xStart+(tvals.length-1)*xStep+',140 '+xStart+',140" fill="url(#'+gid+')"/>'+
    '<polyline points="'+polyPts.trim()+'" fill="none" stroke="'+ac+'" stroke-width="2" stroke-linejoin="round"/>'+
    points+'</svg>';

  // OEE chart
  const accentColors = ['var(--accent-purple)','var(--accent-blue)','var(--accent-green)','var(--accent-yellow)','var(--accent-orange)'];
  let oeeParts = '';
  D.oee.forEach((o,i)=>{
    const y=18+i*30;
    oeeParts += '<text x="10" y="'+(y+10)+'" font-size="11" fill="var(--text-secondary)">'+o.label+'</text>';
    oeeParts += '<rect x="80" y="'+y+'" width="180" height="10" rx="5" fill="'+cbb+'"/>';
    oeeParts += '<rect x="80" y="'+y+'" width="'+Math.min(o.value/100*180,180)+'" height="10" rx="5" fill="'+accentColors[i]+'" opacity="0.7"/>';
    oeeParts += '<text x="'+(Math.min(o.value/100*180,150)+86)+'" y="'+(y+10)+'" font-size="11" fill="'+accentColors[i]+'">'+o.value+'%</text>';
    oeeParts += '<text x="310" y="'+(y+10)+'" font-size="11" fill="var(--text-secondary)">均:'+o.avg+'%</text>';
  });
  oeeParts += '<rect x="10" y="168" width="12" height="6" rx="3" fill="'+accentColors[1]+'" opacity="0.7"/>';
  oeeParts += '<text x="26" y="175" font-size="11" fill="var(--text-secondary)">本班组</text>';
  oeeParts += '<rect x="100" y="168" width="12" height="6" rx="3" fill="'+cbb+'"/>';
  oeeParts += '<text x="116" y="175" font-size="11" fill="var(--text-secondary)">工厂均值</text>';
  const oeeSvg = '<svg viewBox="0 0 400 200" style="height:calc(100% - 44px);width:100%"><g>'+oeeParts+'</g></svg>';

  t1.innerHTML =
    '<div class="t1-org">'+
    '<div class="section-label">组织信息</div>'+
    '<div class="org-avatar-row">'+
    '<div class="org-avatar">'+D.org.supervisor.name.charAt(0)+'</div>'+
    '<div><div class="org-info-name">'+D.org.supervisor.name+'</div><div class="org-info-sub">班组长 · 工号 '+D.org.supervisor.id+'</div></div>'+
    '</div>'+
    '<div class="stat-row">'+
    '<div class="stat-box"><div class="label">在岗人数</div><div class="value" style="color:var(--accent-blue)">'+D.org.headcount+'<span class="unit">人</span></div></div>'+
    '<div class="stat-box"><div class="label">出勤率</div><div class="value" style="color:var(--accent-green)">'+D.org.attendance+'<span class="unit">%</span></div></div>'+
    '<div class="stat-box"><div class="label">工作年限均值</div><div class="value" style="color:var(--accent-purple)">'+D.org.avgTenure+'<span class="unit">年</span></div></div>'+
    '<div class="stat-box"><div class="label">本月加班工时</div><div class="value" style="color:var(--accent-yellow)">'+D.org.overtime+'<span class="unit">h</span></div></div>'+
    '</div>'+
    '<div class="month-theme"><div class="mt-label">▸ '+D.month.name+'主题</div><div class="mt-text">"'+D.month.theme+'"<br>'+D.month.themeSub+'</div></div>'+
    '<div class="section-label" style="margin-top:8px">本月公告</div>'+
    '<div class="notice-list">'+noticesHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:2;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-blue)"></span>'+D.month.name+' KPI 指标达成</div><span class="card-tag">目标 vs 实际</span></div>'+
    '<div class="kpi-grid">'+kpiHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:3;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-yellow)"></span>'+D.month.name+'光荣榜</div><span class="card-tag" style="background:rgba(227,179,65,0.12);color:var(--accent-yellow);border-color:rgba(227,179,65,0.25)">月度表彰</span></div>'+
    '<div class="honor-list">'+honorHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:2;grid-row:2">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-green)"></span>月度产量趋势</div><span class="card-tag" style="background:rgba(63,185,80,0.1);color:var(--accent-green);border-color:rgba(63,185,80,0.25)">近6个月</span></div>'+
    trendSvg+'</div>'+
    '<div class="card" style="grid-column:3;grid-row:2">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-purple)"></span>OEE 对比</div><span class="card-tag" style="background:rgba(163,113,247,0.1);color:var(--accent-purple);border-color:rgba(163,113,247,0.25)">本班 vs 工厂均值</span></div>'+
    oeeSvg+'</div>';
}

// ===== RENDER TAB 2 =====
function renderTab2(D) {
  const t2 = document.getElementById('t2Content');
  if (!t2) return;
  const theme = getTheme();
  const cg = chartGridColor(), cbb = chartBarBg();
  const qac = theme==='dark'?'var(--accent-green)':'var(--accent-green)';

  const qHtml = D.quality.map(q =>
    '<div class="q-stat"><div class="qval" style="color:var(--accent-'+q.color+')">'+q.value+'</div><div class="qlbl">'+q.label+'</div></div>'
  ).join('');

  let qTrendBars = '';
  const qvals = D.qualityTrend.values;
  D.qualityTrend.months.forEach((m,i)=>{
    const isLast=i===qvals.length-1;
    const h=(qvals[i]/100)*60;
    const x=10+i*62;
    const txtCol=isLast?qac:'var(--text-secondary)';
    const wt=isLast?'font-weight="600"':'';
    qTrendBars += '<rect x="'+x+'" y="'+(80-h)+'" width="52" height="'+h+'" rx="4" fill="'+cbb+'"/>';
    qTrendBars += '<rect x="'+x+'" y="'+(80-h)+'" width="52" height="'+h+'" rx="4" fill="'+qac+'" opacity="'+(0.4+i*0.1)+'"/>';
    qTrendBars += '<text x="'+(x+26)+'" y="'+(80-h-6)+'" text-anchor="middle" font-size="10" fill="'+txtCol+'" '+wt+'>'+qvals[i]+'</text>';
    qTrendBars += '<text x="'+(x+26)+'" y="96" text-anchor="middle" font-size="10" fill="'+txtCol+'" '+wt+'>'+m+'</text>';
  });

  const casesHtml = D.cases.map(c => {
    const done = c.status==='已关闭'||c.status==='已整改'||c.status==='已优化'||c.status==='已落实';
    return '<div class="case-item'+(c.type==='quality'?' quality':'')+'">'+
    '<div class="case-type'+(c.type==='safety'?' safety':'')+'">'+(c.type==='quality'?'质量案例':'安全案例')+'</div>'+
    '<div class="case-title">'+c.title+'</div>'+
    '<div class="case-desc">'+c.desc+'</div>'+
    '<div class="case-footer"><span>'+c.date+'</span><span style="color:'+(done?'var(--accent-green)':'var(--accent-orange)')+'">'+c.status+'</span></div>'+
    '</div>';
  }).join('');

  const risksHtml = D.risks.map(r =>
    '<div class="risk-item '+r.level+'">'+
    '<span class="risk-level '+r.level+'">'+(r.level==='high'?'高风险':r.level==='mid'?'中风险':'低风险')+'</span>'+
    '<span class="risk-text">'+r.text+'</span>'+
    '<span class="risk-status" style="color:'+(r.status==='已完成'?'var(--accent-green)':'var(--accent-orange)')+'">'+r.status+'</span>'+
    '</div>'
  ).join('');

  const promosHtml = D.promos.map(p =>
    '<div class="promo-item"><div class="promo-icon">'+p.icon+'</div><div><div class="promo-text">'+p.title+'</div><div class="promo-sub">'+p.sub+'</div></div></div>'
  ).join('');

  t2.innerHTML =
    '<div class="card" style="grid-column:1;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-green)"></span>安全工时统计</div><span class="card-tag" style="background:rgba(63,185,80,0.1);color:var(--accent-green);border-color:rgba(63,185,80,0.25)">'+D.month.name+'</span></div>'+
    '<div style="text-align:center;padding:10px 0 8px"><div style="font-size:11px;color:var(--text-secondary);letter-spacing:1px;margin-bottom:8px">连续安全生产天数</div><div class="safe-days">'+D.safety.safeDays+'</div><div style="font-size:13px;color:var(--accent-green);margin-top:4px">天 · 零事故</div></div>'+
    '<div class="safe-metrics" style="margin-top:12px">'+
    '<div class="safe-metric-box"><div class="big" style="color:var(--accent-blue)">'+D.safety.safeHours.toLocaleString()+'</div><div class="lbl">累计安全工时（h）</div></div>'+
    '<div class="safe-metric-box"><div class="big" style="color:var(--accent-orange)">'+D.safety.issuesFixed+'</div><div class="lbl">隐患整改完成数</div></div>'+
    '</div></div>'+
    '<div class="card" style="grid-column:2;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-orange)"></span>质量指标</div><span class="card-tag" style="background:rgba(240,136,62,0.1);color:var(--accent-orange);border-color:rgba(240,136,62,0.25)">'+D.month.name+'</span></div>'+
    '<div class="quality-stats">'+qHtml+'</div>'+
    '<svg viewBox="0 0 400 100" style="width:100%;height:90px;margin-top:10px"><text x="10" y="12" font-size="10" fill="var(--text-secondary)">良率月趋势</text>'+qTrendBars+'</svg>'+
    '</div>'+
    '<div class="card" style="grid-column:3;grid-row:1/3">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-red)"></span>典型案例展示</div><span class="card-tag" style="background:rgba(248,81,73,0.1);color:var(--accent-red);border-color:rgba(248,81,73,0.25)">本月案例</span></div>'+
    '<div class="case-list">'+casesHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:1;grid-row:2">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-red)"></span>风险隐患跟踪</div><span class="card-tag" style="background:rgba(248,81,73,0.1);color:var(--accent-red);border-color:rgba(248,81,73,0.25)">待处理 '+D.risks.filter(r=>r.status!=='已完成').length+' 项</span></div>'+
    '<div class="risk-list">'+risksHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:2;grid-row:2">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-orange)"></span>安全宣传要点</div></div>'+
    '<div class="promo-banner">'+promosHtml+'</div>'+
    '</div>';
}

// ===== RENDER TAB 3 =====
function renderTab3(D) {
  const t3 = document.getElementById('t3Content');
  if (!t3) return;

  const actColors = ['rgba(79,156,249,0.15)','rgba(63,185,80,0.08)','rgba(240,136,62,0.08)','rgba(163,113,247,0.08)'];
  const actTextColors = ['var(--accent-purple)','var(--accent-green)','var(--accent-orange)','var(--accent-purple)'];
  const activitiesHtml = D.activities.map((a,i)=>{
    if (a.main) {
      return '<div class="photo-box main"><div style="width:100%;height:100%;background:linear-gradient(135deg,rgba(79,156,249,0.15),rgba(163,113,247,0.15));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div style="font-size:48px;opacity:0.5">'+a.icon+'</div><div style="font-size:15px;font-weight:600;color:var(--accent-purple)">'+a.title+'</div><div style="font-size:12px;color:var(--text-secondary)">'+a.desc+'</div></div>'+(a.overlay?'<div class="photo-overlay">📌 '+a.overlay+'</div>':'')+'</div>';
    }
    const ci = (i-1)%actColors.length;
    return '<div class="photo-box"><div style="text-align:center;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:'+(actColors[ci]||actColors[0])+'"><div style="font-size:36px;opacity:0.5">'+a.icon+'</div><div style="font-size:13px;color:'+(actTextColors[ci]||actTextColors[0])+';font-weight:500">'+a.title+'</div><div style="font-size:11px;color:var(--text-muted)">'+a.desc+'</div></div></div>';
  }).join('');

  const birthdaysHtml = D.birthdays.map((b,i)=>
    '<div class="birthday-item"'+(b.upcoming?' style="border:1px dashed rgba(163,113,247,0.3)"':'')+'>'+
    '<div class="birthday-avatar" style="background:'+avatars[i%avatars.length]+'">'+b.surname+'</div>'+
    '<div><div class="birthday-name">'+b.name+'</div><div class="birthday-date"'+(b.upcoming?' style="color:var(--accent-purple)"':'')+'>'+b.date+(b.upcoming?' · 即将到来':'')+' · '+b.dept+'</div></div>'+
    '<div class="birthday-icon">'+(b.upcoming?'🎁':'🎂')+'</div></div>'
  ).join('');

  const maxScore = Math.max(...D.scores.map(s=>s.score),1);
  const rankIcon = ['🥇','🥈','🥉'];
  const scColors = ['var(--accent-yellow)','#B4B2A9','var(--accent-orange)','var(--accent-blue)','var(--accent-purple)','var(--accent-green)'];
  const scoresHtml = D.scores.map((s,i)=>
    '<div class="score-item"><div class="score-rank" style="color:'+(i<3?scColors[i]:'var(--text-muted)')+'">'+(i<3?rankIcon[i]:s.rank)+'</div>'+
    '<div class="score-name">'+s.name+'</div>'+
    '<div class="score-bar-wrap"><div class="score-bar" style="width:'+(s.score/maxScore*100)+'%;background:'+scColors[i]+'"></div></div>'+
    '<div class="score-val" style="color:'+scColors[i]+'">'+s.score+'</div></div>'
  ).join('');

  const wallHtml = D.wall.map((w,i)=>{
    if (w.anonymous) {
      return '<div class="wall-item" style="border:1px dashed var(--border);background:rgba(163,113,247,0.04)"><div class="wall-header"><div class="wall-avatar" style="background:var(--bg-card2);border:1px solid var(--border);color:var(--text-muted)">?</div><div class="wall-name" style="color:var(--text-muted)">匿名员工</div><div class="wall-time">'+w.time+'</div></div><div class="wall-text" style="color:var(--text-muted)">'+w.text+'</div><div class="wall-like" style="color:var(--text-muted)">❤ '+w.likes+' 点赞</div></div>';
    }
    return '<div class="wall-item"><div class="wall-header"><div class="wall-avatar" style="background:'+avatars[i%avatars.length]+'">'+w.surname+'</div><div class="wall-name">'+w.name+'</div><div class="wall-time">'+w.time+'</div></div><div class="wall-text">'+w.text+'</div><div class="wall-like">❤ '+w.likes+' 点赞</div></div>';
  }).join('');

  t3.innerHTML =
    '<div class="card" style="grid-column:1;grid-row:1/3">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-purple)"></span>班组文娱活动</div><span class="card-tag" style="background:rgba(163,113,247,0.1);color:var(--accent-purple);border-color:rgba(163,113,247,0.25)">'+D.month.name+'活动</span></div>'+
    '<div class="activity-photos">'+activitiesHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:2;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:#D4537E"></span>本月生日员工</div><span class="card-tag" style="background:rgba(212,83,126,0.1);color:#D4537E;border-color:rgba(212,83,126,0.25)">'+D.month.name+'</span></div>'+
    '<div class="birthday-list">'+birthdaysHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:3;grid-row:1">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-yellow)"></span>积分排行榜</div><span class="card-tag" style="background:rgba(227,179,65,0.1);color:var(--accent-yellow);border-color:rgba(227,179,65,0.25)">'+D.month.name+'累计</span></div>'+
    '<div class="score-list">'+scoresHtml+'</div>'+
    '</div>'+
    '<div class="card" style="grid-column:2/4;grid-row:2">'+
    '<div class="card-header"><div class="card-title"><span class="card-title-dot" style="background:var(--accent-blue)"></span>员工心声留言墙</div><div class="qr-section"><div class="qr-box">📱</div><div class="qr-text">扫码留言</div></div></div>'+
    '<div class="wall-grid">'+wallHtml+'</div>'+
    '</div>';
}

// ===== INIT BOARD =====
async function initBoard() {
  const D = await loadData();
  if (!D) return;

  document.getElementById('headerBadge').textContent = D.org.badge;
  document.getElementById('headerName').textContent = D.org.name;
  document.getElementById('headerSub').textContent = D.org.subtitle;
  if (document.title === '基层组织电子白板看板') {
    document.title = D.org.name + ' · 基层数字看板';
  }
  document.getElementById('weatherTemp').textContent = D.weather.icon + ' ' + D.weather.temp;
  document.getElementById('weatherDesc').textContent = D.weather.city + ' · ' + D.weather.desc;

  renderTab1(D);
  renderTab2(D);
  renderTab3(D);
}

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = h+':'+m+':'+s;
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('datestr').textContent =
    now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+days[now.getDay()];
}

// ===== TAB SWITCHING =====
let currentTab = 0;
const TOTAL_TABS = 3;
const TAB_DURATION = 30000;
let elapsed = 0;
let progressTimer = null;
let autoPlay = true;

const pages = Array.from(document.querySelectorAll('.tab-page'));
const btns = Array.from(document.querySelectorAll('.tab-item'));
const indicators = [document.getElementById('ind0'),document.getElementById('ind1'),document.getElementById('ind2')];

function updateIndicators(idx) {
  indicators.forEach((d,i)=>d.classList.toggle('current',i===idx));
}

function switchTab(idx) {
  if (idx === currentTab) return;
  const prevIdx = currentTab;
  pages[prevIdx].style.opacity = '0';
  btns[prevIdx].classList.remove('active');
  setTimeout(()=>{ pages[prevIdx].style.display = 'none'; },400);
  currentTab = idx;
  pages[currentTab].style.display = 'flex';
  btns[currentTab].classList.add('active');
  updateIndicators(currentTab);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{ pages[currentTab].style.opacity = '1'; });
  });
  elapsed = 0;
  document.getElementById('scrollBar').style.width = '0%';
}

btns.forEach((btn,i)=>{
  btn.addEventListener('click',()=>{
    clearInterval(progressTimer);
    switchTab(i);
    startProgress();
  });
});

// Nav buttons
document.getElementById('btnPrev').addEventListener('click',()=>{
  clearInterval(progressTimer);
  switchTab((currentTab - 1 + TOTAL_TABS) % TOTAL_TABS);
  startProgress();
});

document.getElementById('btnNext').addEventListener('click',()=>{
  clearInterval(progressTimer);
  switchTab((currentTab + 1) % TOTAL_TABS);
  startProgress();
});

// Auto-play toggle
const autoBadge = document.getElementById('autoBadge');
const autoLabelEl = document.getElementById('autoLabel');
autoBadge.addEventListener('click',()=>{
  autoPlay = !autoPlay;
  if (autoPlay) {
    autoBadge.classList.remove('paused');
    autoLabelEl.textContent = '轮播中 · 30s';
    elapsed = 0;
    document.getElementById('scrollBar').style.width = '0%';
    startProgress();
  } else {
    autoBadge.classList.add('paused');
    autoLabelEl.textContent = '已暂停';
    clearInterval(progressTimer);
  }
});

function startProgress() {
  clearInterval(progressTimer);
  if (!autoPlay) return;
  progressTimer = setInterval(()=>{
    elapsed += 100;
    const pct = Math.min((elapsed / TAB_DURATION)*100,100);
    document.getElementById('scrollBar').style.width = pct+'%';
    if (elapsed >= TAB_DURATION) {
      clearInterval(progressTimer);
      switchTab((currentTab+1) % TOTAL_TABS);
      startProgress();
    }
  },100);
}

// ===== THEME SWITCHING =====
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');

async function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  if (theme==='light') {
    themeIcon.textContent = '☀';
    themeLabel.textContent = '暗色';
  } else {
    themeIcon.textContent = '🌙';
    themeLabel.textContent = '亮色';
  }
  // Re-render all tabs to apply theme-specific SVG colors
  await initBoard();
}

// Load persisted theme
const savedTheme = localStorage.getItem('board-theme');
if (savedTheme) applyTheme(savedTheme);

themeToggle.addEventListener('click',async ()=>{
  const current = document.documentElement.dataset.theme||'dark';
  const next = current==='dark'?'light':'dark';
  await applyTheme(next);
  localStorage.setItem('board-theme',next);
});

// ===== STARTUP =====
(async function(){
  await initBoard();
  setInterval(updateClock,1000);
  updateClock();
  pages[0].style.display = 'flex';
  pages[0].style.opacity = '1';
  btns[0].classList.add('active');
  updateIndicators(0);
  startProgress();
})();
</script>
